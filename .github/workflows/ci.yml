name: CI & Quantitative Benchmarks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Generate recruitment applications dataset
      run: |
        python src/data_generator.py --records 25000
    - name: Run Tableau Prep Engine
      run: |
        python src/tableau_prep_engine.py
    - name: Run Executive Excel Reporter
      run: |
        python src/excel_reporter.py
    - name: Run Pytest Suite
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v
    - name: Run Latency Benchmarks
      env:
        PYTHONPATH: .
      run: |
        python tests/benchmark.py
